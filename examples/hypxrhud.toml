# hypxrhud — example configuration.
#
# Copy to $XDG_CONFIG_HOME/hypxrhud/hypxrhud.toml (or ~/.config/hypxrhud/hypxrhud.toml).
# All keys are optional; the values shown are the defaults. The loader is a deliberately
# thin TOML subset (one struct) so a Lua front end can swap in later behind the same
# config — do not rely on advanced TOML features.

[hud]
# Overlay stacking placement (sessionLayersPlacement). HypXRland's monitors default to
# 1; hypxrpaper's background pins to INT64_MIN. 20 keeps the HUD on top of the monitors.
z = 20

# DRM render node to bind EGL/GBM on. MUST match the node the XR runtime uses. Empty =
# auto-scan for the first working render node. (--gpu overrides this.)
gpu = ""

# Default per-panel peak opacity ceiling (the color-scale-bias .a at full fade-in).
opacity = 0.92

# Environment blend mode for the overlay's own frames: auto | opaque | alpha | additive.
# "auto" (default) prefers ALPHA_BLEND when the runtime advertises it, so the HUD panels
# composite over passthrough; an OPAQUE overlay would paint the whole view black over
# passthrough. It falls back to the runtime's preferred mode when alpha is unavailable.
blend_mode = "auto"

# Max simultaneous panels per client (so one buggy client can't exhaust the scene).
per_client_cap = 4

# Per-panel swapchain / raster size (pixels). Content hugs the centre with transparent
# margins, so this is a canvas, not the on-screen size (that is the quad `size`, metres).
tex_w = 768
tex_h = 384

# Default fade envelope for transient panels (ms). hold_ms < 0 (per-panel) = persist.
rise_ms = 110
hold_ms = 2600
fade_ms = 450

# Runtime re-probe backoff (WP-H4). While no XR runtime is present the daemon keeps
# serving D-Bus and retries xrCreateInstance on a growing backoff, doubling from
# reprobe_base_ms up to reprobe_cap_ms (2s -> 4s -> 8s -> ... -> 30s). While the runtime
# is up but the headset is undonned it polls at the gentle fixed reprobe_base_ms cadence.
reprobe_base_ms = 2000
reprobe_cap_ms  = 30000

# ---- theming (WP-H6) ----------------------------------------------------------------
# The panel palette follows the Omarchy CURRENT theme by default: it reads the theme's
# mako.ini (text-color -> foreground, border-color -> accent, background-color -> panel
# fill) and derives the muted hint text + bar tracks. A theme switch (omarchy-theme-set)
# is picked up LIVE via an inotify watch on ~/.config/omarchy/current/theme — no restart.
# When no Omarchy theme is present the built-in palette is used.
#
# [theme]
# follow = true              # follow the Omarchy current theme (default true; false = built-in)
# file   = ""                # override which palette file is read (empty = the theme's mako.ini)
# # Per-role hex overrides win over the theme. mako.ini does NOT carry status colours, so
# # good/warn/bad keep tuned defaults — override them here if your theme needs different ones
# # (especially on a light theme, where the default pastels can be low-contrast).
# normal    = "#ebeef2"
# dim       = "#969ea8"
# accent    = "#78beff"
# good      = "#78dc96"
# warn      = "#fac86e"
# bad       = "#ff7878"
# panel_bg  = "#0d0f14"
# bar_track = "#40454d"

# ---- per-slot overrides -------------------------------------------------------------
# The six slots and their default VIEW-space poses (metres, -z forward). Uncomment and
# edit to re-pose any slot; `pose` is "x,y,z", `size` is the quad width in metres,
# `space` is view|local, `max` is the stack cap (toast only).

# [slot.voice]           # bottom-centre — voice feedback (hypxrvoice)
# pose = "0,-0.28,-1.0"
# size = 0.42

# [slot.keys]            # just above voice — screenkey (hypxrhud-keys)
# pose = "0,-0.14,-1.0"
# size = 0.42

# [slot.voice]           # e.g. hold a busy voice slot for a queued lower-urgency panel
# on_refuse = "queue"    # refuse (default) | queue — a lower-urgency loser is held pending
#                        #   and promoted into the slot when the current occupant leaves.

# [slot.toast]           # top-centre — notification mirror (bounded stack)
# pose = "0,0.30,-1.1"
# size = 0.40
# max  = 3               # per-slot stack depth (WP-H5): newest at the base, oldest evicted

# [slot.status]          # bottom-right — pinned status badge
# pose = "0.55,-0.20,-1.2"
# size = 0.30

# [slot.media]           # top-left — now-playing widget
# pose = "-0.55,0.20,-1.2"
# size = 0.34

# [slot.battery]         # bottom-left — headset + laptop battery gauges
# pose = "-0.55,-0.20,-1.2"
# size = 0.30
